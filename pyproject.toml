[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kismet-tui"
version = "0.1.0"
description = "A field-usable terminal UI for Kismet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["textual>=0.60"]

[project.scripts]
kismet-tui = "kismet_tui.__main__:main"

[tool.setuptools.packages.find]
include = ["kismet_tui*"]
